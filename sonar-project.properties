sonar.projectKey=cmiic_glanceboard
sonar.organization=cmiic
sonar.sourceEncoding=UTF-8

# The extension in src/, with the build and lint configuration and the
# workflows around it. The unit suites in test/ and the browser tests in e2e/
# are tests, never source. Git-ignored output (.output/, .wxt/, node_modules/)
# is skipped by the scanner on its own; the icons are not source, and the
# scanner would only try to read them as text.
sonar.sources=.
sonar.tests=test,e2e
sonar.exclusions=test/**,e2e/**,public/**

# Coverage is the LCOV report `npm run test:coverage` writes before the scan.
# Node's test runner covers the pure logic in src/lib/. The Vue components and
# the background, popup and dashboard entrypoints are verified by hand
# (TESTING.md), and the build and lint configuration is not code to test:
# counted, every pull request touching them would fail the quality gate's 80%
# coverage on new code. Logic worth testing belongs in src/lib/.
sonar.javascript.lcov.reportPaths=coverage.lcov
sonar.coverage.exclusions=src/ui/**,src/entrypoints/**,*.config.js,*.config.ts

sonar.issue.ignore.multicriteria=sequentialAwaits,vueProxyClone,httpHostAccess,emptySeedList

# javascript:S9382 asks to run the awaits in a loop concurrently. They are
# sequential on purpose: a storage write reads, changes and writes back a whole
# list, so concurrent writes lose each other's updates; network work runs one
# request at a time, so the extension never fans out against someone's server
# (SECURITY.md); and a response stream is read one chunk after the other.
sonar.issue.ignore.multicriteria.sequentialAwaits.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.sequentialAwaits.resourceKey=**/*

# javascript:S7784 asks for structuredClone() over a JSON round-trip. Values
# coming from Vue are reactive Proxy objects, which the structured-clone
# algorithm rejects with DataCloneError; plainStorageValue() serializes them for
# exactly that reason. Only that file is exempt.
sonar.issue.ignore.multicriteria.vueProxyClone.ruleKey=javascript:S7784
sonar.issue.ignore.multicriteria.vueProxyClone.resourceKey=src/lib/storage.js

# typescript:S5332 flags the http:// pattern among the optional host
# permissions. Monitoring plain-HTTP sites is a feature; each origin is still
# requested on its own when the user adds it (SECURITY.md, "Permissions").
sonar.issue.ignore.multicriteria.httpHostAccess.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.httpHostAccess.resourceKey=wxt.config.ts

# javascript:S4158 reports that SEED_HOSTNAMES is always empty. It is: the
# default host list is empty by design, and ensureSeeded() still records the
# first run (storage.test.js pins that).
sonar.issue.ignore.multicriteria.emptySeedList.ruleKey=javascript:S4158
sonar.issue.ignore.multicriteria.emptySeedList.resourceKey=src/lib/storage.js
